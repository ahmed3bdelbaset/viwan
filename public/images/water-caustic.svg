<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <defs>
    <filter id="wave-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <linearGradient id="caustic-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73D0EA" stop-opacity="0" />
      <stop offset="30%" stop-color="#AEE8F5" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#E2F7FC" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#AEE8F5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#73D0EA" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="caustic-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0" />
      <stop offset="40%" stop-color="#EBD8BF" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#FFF2DF" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#EBD8BF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g filter="url(#wave-blur)">
    {/* Upper deep pool waves (finer, tighter perspective) */}
    <path d="M0 40 Q150 35 300 42 T600 38 T900 44 T1200 40" stroke="url(#caustic-cyan)" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M0 70 Q200 76 400 68 T800 74 T1200 70" stroke="url(#caustic-gold)" stroke-width="2.5" fill="none" opacity="0.45" />
    <path d="M0 105 Q180 98 360 108 T720 102 T1080 110 T1200 105" stroke="url(#caustic-cyan)" stroke-width="2.8" fill="none" opacity="0.5" />

    {/* Mid pool waves (medium spacing and thickness) */}
    <path d="M0 145 Q220 155 440 142 T880 150 T1200 144" stroke="url(#caustic-gold)" stroke-width="3.5" fill="none" opacity="0.6" />
    <path d="M0 190 Q250 178 500 195 T1000 186 T1200 192" stroke="url(#caustic-cyan)" stroke-width="4" fill="none" opacity="0.65" />
    <path d="M0 240 Q280 252 560 236 T1120 248 T1200 240" stroke="url(#caustic-gold)" stroke-width="4.5" fill="none" opacity="0.7" />

    {/* Foreground near-edge waves (broad, distinct crests) */}
    <path d="M0 295 Q300 282 600 304 T1200 294" stroke="url(#caustic-cyan)" stroke-width="5" fill="none" opacity="0.75" />
    <path d="M0 350 Q320 366 640 345 T1200 352" stroke="url(#caustic-gold)" stroke-width="6" fill="none" opacity="0.8" />
  </g>
</svg>
